[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mascot-wardrobe"
version = "0.1.0"
description = "Generate a mascot's weather wardrobe once, then select outfits by temperature, offline and deterministic"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["Pillow>=11,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "detect-secrets>=1.5", "build>=1"]

[project.scripts]
mascot-wardrobe = "mascot_wardrobe.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mascot_wardrobe.infrastructure" = ["profiles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
